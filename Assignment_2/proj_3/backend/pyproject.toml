[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crisp-dm-clustering"
version = "0.1.0"
description = "CRISP-DM Autonomous Clustering & Autoresearch Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]
advanced = [
    "scikit-learn-extra>=0.3.0",
    "umap-learn>=0.5.4",
    "hdbscan>=0.8.33",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
